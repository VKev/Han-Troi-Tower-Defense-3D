<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09111f">
  <title>Con Cóc Là Cậu Ông Trời</title>
  <meta name="description" content="Game thủ thành Âm Dương với năm màn mở khóa linh thú.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" id="gameShell" aria-label="Con Cóc Là Cậu Ông Trời">
    <canvas id="gameCanvas" width="960" height="560" aria-label="Chiến trường thủ thành"></canvas>

    <header class="hud-top" aria-label="Trạng thái trận đấu">
      <div class="brand-chip"><span>🐸</span><strong>Đền mưa</strong></div>
      <div class="resource-chip water-stat"><span>💧</span><strong id="waterValue">0</strong></div>
      <div class="resource-chip frog-health">
        <span>❤</span>
        <div class="health-track" id="healthBar" role="progressbar" aria-label="Máu của Cóc" aria-valuemin="0" aria-valuemax="40" aria-valuenow="40"><i id="healthFill"></i></div>
      </div>
      <div class="resource-chip"><span>⚔</span><strong id="waveValue">0 / 0</strong></div>
      <div class="resource-chip"><span>👹</span><strong id="enemyValue">0</strong></div>
    </header>

    <nav class="hud-menu" aria-label="Điều khiển trận đấu">
      <button id="levelButton" type="button" aria-label="Chọn màn">🗺 Màn 1</button>
      <button id="tutorialButton" type="button" aria-label="Xem lại hướng dẫn">?</button>
      <button id="pauseButton" type="button" aria-label="Tạm dừng">⏸</button>
      <button id="restartButton" type="button" aria-label="Chơi lại màn">↻</button>
    </nav>

    <div class="battle-banner" id="battleBanner" role="status" aria-live="polite"></div>

    <div class="tutorial-pointer hidden" id="tutorialPointer" aria-hidden="true">
      <div class="tutorial-pointer-cue"><span>👇</span><small id="tutorialPointerLabel">Chạm đây</small></div>
    </div>

    <section class="shop-dock" aria-label="Mua linh thú">
      <p class="placement-hint" id="placementHint">Chọn thú → chạm vòng trống.</p>
      <div class="tower-shop" id="towerShop"></div>
      <button class="wave-button" id="waveButton" type="button">⚔ Đợt 1</button>
    </section>

    <aside class="inspector" id="inspector" aria-live="polite">
      <button class="panel-close" id="inspectorClose" type="button" aria-label="Đóng">×</button>
      <p class="eyebrow">Chi tiết</p>
      <h2 id="inspectorTitle">Chưa chọn trụ</h2>
      <p id="inspectorDescription">Chạm trụ để xem tầm, Nghiệp và nâng cấp.</p>
      <div class="karma-readout hidden" id="karmaReadout">
        <div class="karma-label"><span id="phaseLabel">Dương</span><span id="karmaText">0 / 0</span></div>
        <div class="karma-track"><div id="karmaFill"></div></div>
      </div>
      <div class="effect-grid hidden" id="effectGrid">
        <div><span>Dương</span><p id="yangEffect"></p></div>
        <div><span>Âm</span><p id="yinEffect"></p></div>
      </div>
      <div class="upgrade-panel hidden" id="upgradePanel">
        <div class="upgrade-heading"><span>▲ Nâng cấp</span><small id="upgradeLimit">0 / 3</small></div>
        <div class="upgrade-options" id="upgradeOptions"></div>
      </div>
      <button class="sell-button hidden" id="sellButton" type="button">♻ Bán trụ</button>
    </aside>

    <div class="status-legend" id="statusLegend" aria-label="Hiệu ứng trên địch">
      <button class="status-icon" type="button" data-status="slow" data-tooltip="Chậm: giảm tốc độ di chuyển" aria-label="Chậm: giảm tốc độ di chuyển">🐌</button>
      <button class="status-icon" type="button" data-status="haste" data-tooltip="Tăng tốc: +45%; giữ 2 giây sau khi rời tầm Gấu" aria-label="Tăng tốc: +45%; giữ 2 giây sau khi rời tầm Gấu">⚡</button>
        <button class="status-icon" type="button" data-status="poison" data-tooltip="Độc: quái chạy càng nhanh, damage càng mạnh" aria-label="Độc: quái chạy càng nhanh, damage càng mạnh">☠</button>
      <button class="status-icon" type="button" data-status="armor" data-tooltip="Giáp: giảm damage vật lý" aria-label="Giáp: giảm damage vật lý">⬡</button>
      <button class="status-icon" type="button" data-status="resist" data-tooltip="Kháng phép: giảm damage phép" aria-label="Kháng phép: giảm damage phép">✦</button>
      <button class="status-icon" type="button" data-status="shield" data-tooltip="Khiên: hấp thụ damage trước máu" aria-label="Khiên: hấp thụ damage trước máu">🛡</button>
      <button class="status-icon" type="button" data-status="invisible" data-tooltip="Tàng hình: cần Cua Dương soi lộ" aria-label="Tàng hình: cần Cua Dương soi lộ">👻</button>
    </div>

    <section class="modal-layer hidden" id="tutorialOverlay" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle">
      <div class="tutorial-card">
        <div class="tutorial-progress" id="tutorialProgress">1 / 1</div>
        <div class="tutorial-icon" id="tutorialIcon">🐸</div>
        <p class="eyebrow" id="tutorialKicker">Hướng dẫn</p>
        <h2 id="tutorialTitle">Chào người gọi mưa</h2>
        <p id="tutorialBody"></p>
        <div class="tutorial-actions">
          <button id="tutorialLevelButton" type="button">Bỏ qua · Chọn màn</button>
          <button class="continue-button" id="tutorialContinue" type="button">Tiếp tục →</button>
        </div>
      </div>
    </section>

    <section class="modal-layer hidden" id="enemyIntroOverlay" role="dialog" aria-modal="true" aria-labelledby="enemyIntroTitle">
      <div class="tutorial-card enemy-intro-card">
        <div class="tutorial-icon" id="enemyIntroIcon">●</div>
        <p class="eyebrow">Kẻ địch mới</p>
        <h2 id="enemyIntroTitle">Quái bộ</h2>
        <p id="enemyIntroBody"></p>
        <button class="continue-button" id="enemyIntroContinue" type="button">Đã hiểu →</button>
      </div>
    </section>

    <section class="modal-layer hidden" id="levelOverlay" role="dialog" aria-modal="true" aria-labelledby="levelTitle">
      <div class="level-card">
        <button class="panel-close" id="levelClose" type="button" aria-label="Đóng">×</button>
        <p class="eyebrow">Hành trình gọi mưa</p>
        <h2 id="levelTitle">Chọn màn</h2>
        <div class="level-grid" id="levelGrid"></div>
      </div>
    </section>

    <section class="modal-layer hidden" id="levelCompleteOverlay" role="dialog" aria-modal="true" aria-labelledby="levelCompleteTitle">
      <div class="complete-card">
        <div class="tutorial-icon">🌧</div>
        <p class="eyebrow">Màn hoàn thành</p>
        <h2 id="levelCompleteTitle">Mưa đã tới</h2>
        <p id="levelCompleteBody"></p>
        <div class="complete-actions">
          <button id="replayLevelButton" type="button">↻ Chơi lại</button>
          <button class="continue-button" id="nextLevelButton" type="button">Màn tiếp →</button>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
